name: meridian-checkout
version: 1.0.0
description: Agent environment for Meridian's checkout payment service
author: meridian-finance/payments-team
license: UNLICENSED

targets:
  - claude

dependencies:
  apm:
    # Baseline (required by the org policy) ...
    - vibeprogrammer/Reproducible-AI-Agent-Environments-demo/packages/meridian-engineering-standards#meridian-engineering-standards-v1.0.0
    # ... plus the role bundle for payment engineers (Chapter 10).
    - vibeprogrammer/Reproducible-AI-Agent-Environments-demo/packages/meridian-role-payments#meridian-role-payments-v1.0.0
  mcp:
    - name: ledger
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@meridian-finance/ledger-mcp@1.4.2"]
      env:
        LEDGER_API_KEY: ${LEDGER_API_KEY}
    - name: microsoft-learn
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
