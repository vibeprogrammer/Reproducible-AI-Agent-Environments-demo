# Chapter 4 demo: two paths reach the same package at different commits.
name: diamond-lab
version: 0.1.0
description: A direct pin that disagrees with a transitive requirement
targets:
  - copilot
dependencies:
  apm:
    # Transitively requires autopilot-comment at v0.33.0 (via the worker).
    - microsoft/apm/packages/autopilot/autopilot-pr-review-scheduler#v0.33.0
    # Directly requires the same package at v0.32.0.
    - microsoft/apm/packages/autopilot/autopilot-comment#v0.32.0
  mcp: []
